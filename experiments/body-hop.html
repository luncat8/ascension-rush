<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Body hop — the chart re-seat</title>
<style>
	html, body {
		margin: 0;
		height: 100%;
		background: #03080f;
		color: #e7eff6;
		overflow: hidden;
		font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
	}
	canvas { display: block; width: 100%; height: 100%; }
	#hud {
		position: fixed;
		top: 14px;
		left: 16px;
		padding: 12px 14px;
		background: rgba(7, 16, 27, 0.82);
		border: 1px solid rgba(191, 214, 227, 0.18);
		border-radius: 10px;
		max-width: 340px;
		pointer-events: none;
	}
	#hud h1 { margin: 0 0 6px; font-size: 11px; letter-spacing: 0.14em; color: #96aabd; font-weight: 600; }
	#hud p { margin: 0 0 8px; color: #96aabd; }
	#readout { color: #e7eff6; white-space: pre; font-size: 11px; }
	#controls {
		position: fixed;
		bottom: 14px;
		left: 16px;
		right: 16px;
		display: flex;
		gap: 8px;
		flex-wrap: wrap;
		align-items: center;
	}
	button {
		font: inherit;
		color: #dce8f0;
		background: rgba(12, 26, 40, 0.92);
		border: 1px solid rgba(191, 214, 227, 0.24);
		border-radius: 7px;
		padding: 7px 11px;
		cursor: pointer;
	}
	button:hover { border-color: rgba(244, 199, 106, 0.7); color: #fff; }
	button[data-active="true"] { border-color: #f4c76a; color: #f4c76a; }
	#hint { color: #6f8598; margin-left: auto; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
	<h1>BODY HOP / CHART RE-SEAT</h1>
	<p>A point with no rocket: it is placed on a body's surface, then sent to
	another body on a straight plane line. The chart re-seats as it goes, so
	the destination's surface becomes the flat ground.</p>
	<div id="readout">booting</div>
</div>
<div id="controls">
	<button id="hop" data-active="true">Hop Lune → world</button>
	<button id="speed">Speed ×1</button>
	<button id="pause">Pause</button>
	<button id="reseat">Re-seat &#9662;</button>
	<input id="slider" type="range" min="0" max="1" step="0.001" value="0" style="flex:1;max-width:220px">
	<span id="hint">space pauses · ← → scrubs</span>
</div>

<script src="../js/namespaces.js"></script>
<script src="../js/util.js"></script>
<script src="../js/constants.js"></script>
<script src="../js/planets.js"></script>
<script src="../js/coords.js"></script>
<script src="../js/camera.js"></script>
<script src="../js/world.js"></script>
<script src="../js/physics.js"></script>
<script src="../js/sky.js"></script>
<script src="../js/render.js"></script>
<script>
(function(root) {
	'use strict';

	var R = root.R;
	var canvas = root.document.getElementById('c');
	var context = canvas.getContext('2d', { alpha: false });
	var readout = root.document.getElementById('readout');
	var slider = root.document.getElementById('slider');
	var speedButton = root.document.getElementById('speed');
	var pauseButton = root.document.getElementById('pause');
	var hopButton = root.document.getElementById('hop');
	var hopper = { wx: 0, wy: 0 };

	// A minimal game: the real renderer reads a rocket position and a sim
	// clock, and that is all this page gives it. There is no physics at all.
	var game = { rocket: hopper, simTime: 0, phase: 'demo' };
	var secondsPerUnit = 1;
	var paused = false;
	var speed = 1;
	var flight = { from: -1, to: 3, t: 0, duration: 9, active: false };

	function resize() {
		var ratio = root.devicePixelRatio || 1;
		var width = Math.max(1, root.innerWidth);
		var height = Math.max(1, root.innerHeight);

		canvas.width = Math.round(width * ratio);
		canvas.height = Math.round(height * ratio);
		context.setTransform(ratio, 0, 0, ratio, 0, 0);
		R.render.resize(width, height);
		R.camera.follow(hopper.wx);
	}
	root.addEventListener('resize', resize);

	// Where a body's surface is, in world coordinates: the point on its surface
	// nearest the active world's surface. Reading it from the catalog keeps the
	// page honest: nothing here is hand-placed.
	function surfacePoint(index) {
		if (index < 0) {
			return { wx: 0, wy: 0, radius: R.world.planet.radius };
		}
		var body = R.constants.sky.bodies[index];
		var distance = R.sky.planePosition(body, game.simTime, { x: 0, y: 0 });
		var angle = Math.atan2(distance.y, distance.x);
		return {
			wx: R.util.mod(angle * R.world.planet.radius, R.world.planet.circumference),
			wy: 0,
			radius: body.radiusRadii * R.world.planet.radius
		};
	}

	function startHop(from, to) {
		var target = surfacePoint(to);
		flight.from = from;
		flight.to = to;
		flight.t = 0;
		flight.active = true;
		flight.startWx = hopper.wx;
		flight.startWy = hopper.wy;
		flight.endWx = target.wx;
		hopper.wy = 0;
	}

	function hopLabel(from, to) {
		var names = ['world'].concat(R.constants.sky.bodies.map(function(b) { return b.name; }));
		return 'Hop ' + names[from + 1] + ' → ' + names[to + 1];
	}

	var pairs = [
		[-1, 3], [3, -1], [-1, 4], [4, -1], [-1, 3]
	];
	var pairIndex = 0;

	function nextPair() {
		pairIndex = (pairIndex + 1) % pairs.length;
		startHop(pairs[pairIndex][0], pairs[pairIndex][1]);
		hopButton.textContent = hopLabel(pairs[pairIndex][0], pairs[pairIndex][1]);
	}

	// The hop itself is a straight interpolation in *world* coordinates, then a
	// re-seat of the chart at the halfway point. Nothing here is physics: the
	// point is a visual probe for the projection.
	function advance(seconds) {
		if (!flight.active) {
			return;
		}
		flight.t = Math.min(1, flight.t + seconds * speed / flight.duration);
		hopper.wx = flight.startWx + (flight.endWx - flight.startWx) * flight.t;
		hopper.wy = flight.startWy + (flight.endWy - flight.startWy) * flight.t;
		if (flight.t >= 0.5 && R.sky.pivot.index !== flight.to) {
			R.sky.seatPivot(flight.to, game);
		}
		if (flight.t >= 1) {
			flight.active = false;
			hopper.wy = 0;
			R.sky.seatPivot(flight.to, game);
		}
		slider.value = String(flight.t);
	}

	function updateReadout() {
		var pivot = R.sky.pivot;
		var camera = R.camera;
		var screen = { x: 0, y: 0 };
		var names = ['world'].concat(R.constants.sky.bodies.map(function(b) { return b.name; }));

		camera.project(hopper.wx, hopper.wy, screen);
		readout.textContent =
			'world   wx ' + Math.round(hopper.wx) + ' m   alt ' + Math.round(hopper.wy) + ' m\n' +
			'screen  x ' + Math.round(screen.x) + ' px   y ' + Math.round(screen.y) + ' px\n' +
			'pivot   ' + names[pivot.index + 1] + '   r ' + Math.round(pivot.radius) + ' m\n' +
			'morph   ' + (pivot.reseating ? pivot.morph.toFixed(2) : 'seated') + '\n' +
			'scale   ' + camera.scalePx.toFixed(1) + ' px/e-fold   flat ' + camera.flat;
	}

	var previous = 0;
	function frame(now) {
		var dt = previous === 0 ? 0 : Math.min((now - previous) / 1000, 0.1);

		previous = now;
		if (!paused) {
			game.simTime += dt;
			advance(dt);
		}
		R.sky.update(game, dt);
		R.camera.follow(hopper.wx);
		R.render.drawChart(context, game);
		R.render.drawProbe(context, hopper.wx, hopper.wy);
		updateReadout();
		root.requestAnimationFrame(frame);
	}

	hopButton.addEventListener('click', nextPair);
	document.getElementById('reseat').addEventListener('click', function() {
		var next = R.sky.pivot.index + 1;
		R.sky.seatPivot(next > R.constants.sky.bodies.length - 1 ? -1 : next, game);
	});
	speedButton.addEventListener('click', function() {
		speed = speed === 1 ? 4 : (speed === 4 ? 12 : 1);
		speedButton.textContent = 'Speed ×' + speed;
	});
	pauseButton.addEventListener('click', function() {
		paused = !paused;
		pauseButton.textContent = paused ? 'Resume' : 'Pause';
	});
	slider.addEventListener('input', function() {
		flight.t = Number(slider.value);
		hopper.wx = flight.startWx + (flight.endWx - flight.startWx) * flight.t;
		hopper.wy = flight.startWy + (flight.endWy - flight.startWy) * flight.t;
	});
	root.addEventListener('keydown', function(event) {
		if (event.key === ' ') {
			paused = !paused;
			pauseButton.textContent = paused ? 'Resume' : 'Pause';
		}
	});

	// Start seated on the world, then hop to the first catalog body. `reset`
	// is after `resize` so the first frame already has a camera.
	R.world.initialize(R.planets.defaultId);
	R.sky.reset();
	R.render.initialize(context);
	resize();
	hopper.wx = 0;
	hopper.wy = 0;
	flight.endWx = 0;
	flight.endWy = 0;
	flight.startWx = 0;
	flight.startWy = 0;
	hopButton.textContent = hopLabel(pairs[0][0], pairs[0][1]);
	startHop(pairs[0][0], pairs[0][1]);
	root.requestAnimationFrame(frame);
})(typeof globalThis !== 'undefined' ? globalThis : this);
</script>
</body>
</html>
