<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chart lab — drag, zoom, follow</title>
<style>
	html, body {
		margin: 0;
		height: 100%;
		background: #03080f;
		color: #e7eff6;
		overflow: hidden;
		font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
	}
	canvas { display: block; width: 100%; height: 100%; touch-action: none; }
	#hud {
		position: fixed;
		top: 14px;
		right: 16px;
		padding: 12px 14px;
		background: rgba(7, 16, 27, 0.82);
		border: 1px solid rgba(191, 214, 227, 0.18);
		border-radius: 10px;
		width: 316px;
		pointer-events: none;
	}
	#hud h1 { margin: 0 0 6px; font-size: 11px; letter-spacing: 0.14em; color: #96aabd; font-weight: 600; }
	#hud p { margin: 0 0 8px; color: #8ea2b4; font-size: 11px; }
	#readout { color: #e7eff6; white-space: pre; font-size: 11px; }
	#controls {
		position: fixed;
		bottom: 14px;
		left: 16px;
		right: 16px;
		display: flex;
		gap: 8px;
		flex-wrap: wrap;
		align-items: center;
	}
	button {
		font: inherit;
		color: #dce8f0;
		background: rgba(12, 26, 40, 0.92);
		border: 1px solid rgba(191, 214, 227, 0.24);
		border-radius: 7px;
		padding: 7px 11px;
		cursor: pointer;
	}
	button:hover { border-color: rgba(244, 199, 106, 0.7); color: #fff; }
	button[data-active="true"] { border-color: #f4c76a; color: #f4c76a; }
	#slider { flex: 1; max-width: 260px; accent-color: #f4c76a; }
	#hint { color: #6f8598; margin-left: auto; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
	<h1>CHART LAB / LOG PROJECTION</h1>
	<p>One chart, one scale. The probe is the camera's target: below the air the
	ground holds the camera, above it the probe does. Drag to pan, wheel to zoom,
	click a body to seat the chart on it.</p>
	<div id="readout">booting</div>
</div>
<div id="controls">
	<button id="climb" data-active="true">Auto climb</button>
	<button id="seat">Seat next body</button>
	<button id="home">Back to world</button>
	<button id="reset">Reset view</button>
	<input id="slider" type="range" min="0" max="90000" step="10" value="0" title="probe altitude">
	<span id="hint">drag the probe up · drag elsewhere to pan · wheel zooms · click a body</span>
</div>

<script src="../js/namespaces.js"></script>
<script src="../js/util.js"></script>
<script src="../js/constants.js"></script>
<script src="../js/planets.js"></script>
<script src="../js/coords.js"></script>
<script src="../js/camera.js"></script>
<script src="../js/world.js"></script>
<script src="../js/physics.js"></script>
<script src="../js/sky.js"></script>
<script src="../js/render.js"></script>
<script src="../js/input.js"></script>
<script>
(function(root) {
	'use strict';

	var R = root.R;
	var canvas = root.document.getElementById('c');
	var context = canvas.getContext('2d', { alpha: false });
	var readout = root.document.getElementById('readout');
	var slider = root.document.getElementById('slider');
	var climbButton = root.document.getElementById('climb');
	var seatButton = root.document.getElementById('seat');
	var homeButton = root.document.getElementById('home');
	var resetButton = root.document.getElementById('reset');
	var probe = { wx: 0, wy: 0 };

	// A minimal game: the renderer reads a ship position and a sim clock, and
	// the camera follows that position. There is no physics on this page — the
	// altitude is a number the slider and the climb set.
	var game = { rocket: probe, simTime: 0, phase: 'demo' };
	root.R.game = game;

	var climbing = true;
	var climbPhase = 0;
	var climbTop = 60000;
	var MAX_ALT = 90000;
	var previous = 0;
	var probeGrabY = 0;
	var scratch = { x: 0, y: 0 };

	function resize() {
		var ratio = root.devicePixelRatio || 1;
		var width = Math.max(1, root.innerWidth);
		var height = Math.max(1, root.innerHeight);

		canvas.width = Math.round(width * ratio);
		canvas.height = Math.round(height * ratio);
		context.setTransform(ratio, 0, 0, ratio, 0, 0);
		R.render.resize(width, height);
		R.camera.follow(probe.wx, probe.wy, 0);
	}
	root.addEventListener('resize', resize);

	function names() {
		return ['world'].concat(R.constants.sky.bodies.map(function(b) { return b.name; }));
	}

	function updateReadout() {
		var camera = R.camera;
		var pivot = R.sky.pivot;
		var screen = { x: 0, y: 0 };

		camera.project(probe.wx, probe.wy, screen);
		readout.textContent =
			'probe   alt ' + Math.round(probe.wy) + ' m   ' + (probe.wy > camera.airTop ? 'above air' : 'in air') + '\n' +
			'screen  x ' + Math.round(screen.x) + '  y ' + Math.round(screen.y) + ' px\n' +
			'pivot   ' + names()[pivot.index + 1] + '\n' +
			'chart   extent ' + Math.round(camera.ceiling / 1000) + ' km   scale ' + camera.scalePx.toFixed(1) + ' px\n' +
			'ladder  knee ' + camera.logScale + ' m   switch ' + (camera.ladderSwitch / 1000).toFixed(1) + ' km   far ' + camera.ladderFar.toFixed(2) + '\n' +
			'camera  pan ' + Math.round(camera.panX) + ',' + Math.round(camera.panY) + '   track ' + Math.round(camera.trackY) + '   zoom ' + camera.zoom.toFixed(2) + '\n' +
			'view    ' + (camera.flat ? 'deck (closed form)' : 'log-polar');
	}

	// Where the follow is aiming: the anchor fraction across, and the follow
	// height down once the probe is above the air (the ground line before that).
	function drawTarget(context) {
		var camera = R.camera;
		var x = camera.width * R.constants.view.cameraAnchorFraction;
		var y = probe.wy > camera.airTop ? camera.height * R.constants.view.followHeight :
			camera.groundY;

		context.save();
		context.setLineDash([3, 5]);
		context.lineWidth = 1;
		context.strokeStyle = 'rgba(244, 199, 106, 0.34)';
		context.beginPath();
		context.moveTo(x, 0);
		context.lineTo(x, camera.height);
		context.moveTo(0, y);
		context.lineTo(camera.width, y);
		context.stroke();
		context.setLineDash([]);
		context.font = '9px ui-monospace, SFMono-Regular, Menlo, monospace';
		context.textAlign = 'left';
		context.fillStyle = 'rgba(244, 199, 106, 0.6)';
		context.fillText('CAMERA TARGET', x + 8, Math.max(12, y - 7));
		context.restore();
	}

	function frame(now) {
		var dt = previous === 0 ? 0 : Math.min((now - previous) / 1000, 0.05);
		var span;

		previous = now;
		game.simTime += dt;
		if (climbing) {
			// Up, hold, down, hold: the camera's target swaps at the top of the
			// air and comes back to the ground on the way down.
			climbPhase = (climbPhase + dt) % 24;
			span = climbPhase < 8 ? climbPhase / 8 :
				(climbPhase < 12 ? 1 : (climbPhase < 20 ? 1 - (climbPhase - 12) / 8 : 0));
			probe.wy = climbTop * span * span * (3 - 2 * span);
		}
		R.sky.update(game, dt);
		R.render.drawChart(context, game);
		drawTarget(context);
		R.render.drawProbe(context, probe.wx, probe.wy);
		slider.value = String(Math.round(probe.wy));
		updateReadout();
		root.requestAnimationFrame(frame);
	}

	// Grabbing the probe is the direct version of the experiment: the pointer
	// lifts it in ladder space, and the camera hands its target over as it
	// crosses the top of the air. Every other press is the chart's own gesture
	// (drag pans, click seats).
	R.input.gestureHook = function(x, y, camera) {
		camera.project(probe.wx, probe.wy, scratch);
		if (Math.abs(scratch.x - x) > 26 || Math.abs(scratch.y - y) > 26) {
			return false;
		}
		climbing = false;
		climbButton.dataset.active = 'false';
		probeGrabY = y;
		return true;
	};
	R.input.gestureMove = function(x, y, camera) {
		// One pixel of pointer is one pixel of chart. Held against the top edge
		// the ladder keeps climbing, so a single drag can reach space.
		var edge = R.util.clamp((80 - y) / 80, 0, 1) * 0.35;
		var units = R.coords.ladder(probe.wy, camera) - (y - probeGrabY) / camera.scalePx + edge;

		probeGrabY = y;
		probe.wy = R.util.clamp(R.coords.unladder(Math.max(0, units), camera.logScale,
			camera.ladderQ0, camera.ladderFar), 0, MAX_ALT);
	};

	slider.max = String(MAX_ALT);
	slider.addEventListener('input', function() {
		climbing = false;
		climbButton.dataset.active = 'false';
		probe.wy = Number(slider.value);
	});
	climbButton.addEventListener('click', function() {
		climbing = !climbing;
		climbButton.dataset.active = climbing ? 'true' : 'false';
	});
	seatButton.addEventListener('click', function() {
		var next = R.sky.pivot.index + 1;

		R.sky.seatPivot(next > R.constants.sky.bodies.length - 1 ? -1 : next, game);
	});
	homeButton.addEventListener('click', function() {
		R.sky.seatPivot(-1, game);
	});
	resetButton.addEventListener('click', function() {
		R.camera.resetPan();
	});
	root.addEventListener('keydown', function(event) {
		if (event.key === ' ') {
			climbing = !climbing;
			climbButton.dataset.active = climbing ? 'true' : 'false';
			event.preventDefault();
		}
		if (event.key === 'r') {
			R.camera.resetPan();
		}
	});

	// Start landed, so the first frame is the deck with the whole system low
	// over the surface. The climb that follows is the experiment: at the top of
	// the air the camera's target changes from the ground to the probe.
	R.world.initialize(R.planets.defaultId);
	R.sky.reset();
	R.render.initialize(context);
	resize();
	R.input.initialize(canvas, R.camera);
	probe.wx = 0;
	probe.wy = 0;
	for (var i = 0; i < 40; i += 1) {
		R.sky.update(game, 0.016);
	}
	root.requestAnimationFrame(frame);
})(typeof globalThis !== 'undefined' ? globalThis : this);
</script>
</body>
</html>
